name: Notify failures

# Runs triggered by Dependabot or by auto-merge notify nobody on failure,
# so turn them into an assignment, which does notify the repo owner.
on:
  workflow_run:
    workflows: [CI, Deploy]
    types: [completed]

permissions:
  issues: write
  pull-requests: write

jobs:
  dependabot-ci-failed:
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Assign owner to the failing Dependabot PR
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$REPO" --add-assignee "$OWNER"
          fi
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-failed:
    if: >-
      github.event.workflow_run.name == 'Deploy' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the deploy-failed issue
        run: |
          body="Deploy failed on \`main\` at ${SHA:0:7}: $RUN_URL"
          issue=$(gh issue list --repo "$REPO" --label deploy-failed --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "$body"
          else
            gh label create deploy-failed --repo "$REPO" --color B60205 --force
            gh issue create --repo "$REPO" --title "Deploy to GitHub Pages is failing" \
              --label deploy-failed --assignee "$OWNER" --body "$body"
          fi
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

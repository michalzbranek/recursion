version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor/patch land in one auto-merged PR, majors are batched per package family
    # so that peer-dependent packages (e.g. vitest + @vitest/coverage-v8) move together.
    # Family groups are limited to majors: Dependabot does not pick the first matching
    # group, so without it they would also catch minor/patch bumps of their packages.
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major"]
      eslint:
        patterns: ["eslint", "@eslint/*"]
        update-types: ["major"]
      typescript:
        patterns: ["typescript", "typescript-eslint"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
